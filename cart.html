<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="cart.css" />
  </head>
  <body>
    <section class="cart-section" id="shopping-cart">
      <h2 class="section-title">Your Cart (3 Items)</h2>

      <div class="cart-container">
        <div class="cart-items-list" id="cart-items-list">
          <div class="cart-item" id="cart-item-1">
            <div class="item-img">
              <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=200&q=80"
                alt="Product"
              />
            </div>

            <div class="item-details">
              <div class="item-main">
                <h3 class="item-heading">Hyper-Light Running Shoes</h3>
                <span class="item-price">$120.00</span>
              </div>

              <div class="item-actions">
                <div class="quantity-controls">
                  <button class="qty-btn" type="button">
                    <i class="fas fa-minus"></i>
                  </button>
                  <span class="qty-number">1</span>
                  <button class="qty-btn" type="button">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>

                <button class="delete-btn" title="Remove Item">
                  <i class="far fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <aside class="cart-summary">
          <h3 class="summary-title">Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$970.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span class="free-text">FREE</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>$970.00</span>
          </div>

          <button class="order-now-btn">
            Order Now <i class="fas fa-arrow-right"></i>
          </button>
        </aside>
      </div>
    </section>
  </body>
</html>
